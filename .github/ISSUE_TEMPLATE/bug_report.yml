name: Bug report
description: Report reproducible incorrect behavior in NanoPT.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not disclose vulnerabilities or hidden-verifier content here; use SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the command, resolved configuration, and sanitized output.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Attach or summarize `nanopt doctor --json` output with personal paths removed.
    validations:
      required: true
