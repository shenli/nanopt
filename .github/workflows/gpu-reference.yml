name: Reference GPU diagnostics

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Full reviewed commit SHA to diagnose
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nanopt-reference-gpu
  cancel-in-progress: false

jobs:
  doctor:
    runs-on: [self-hosted, linux, x64, nanopt-reference]
    timeout-minutes: 15
    steps:
      - name: Require a full immutable SHA
        env:
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
        run: test "${#REVIEWED_SHA}" -eq 40
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.reviewed_sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --frozen
      - name: Diagnose reference profile
        run: uv run nanopt doctor --strict-profile --json doctor.json
      - uses: actions/upload-artifact@v4
        with:
          name: doctor-${{ inputs.reviewed_sha }}
          path: doctor.json
          if-no-files-found: error
