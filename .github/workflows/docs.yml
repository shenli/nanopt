name: Documentation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --frozen --extra docs --extra dev
      - run: uv run python scripts/lint_formulas.py docs
      - run: uv run mkdocs build --strict
