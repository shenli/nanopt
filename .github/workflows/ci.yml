name: CPU CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Verify locked environment
        run: uv sync --frozen --extra dev --extra docs
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src/nanopt
      - name: CPU tests
        run: uv run pytest --cov=nanopt --cov-report=term-missing -m "not gpu and not network and not reference"
      - name: Validate schemas and profiles
        run: uv run python scripts/validate_schemas.py
      - name: Build package
        run: uv build
      - name: Inspect wheel import
        run: uv run python -c "import nanopt; print(nanopt.__version__)"
