repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: formula-lint
        name: documentation formula lint
        entry: python scripts/lint_formulas.py docs
        language: system
        pass_filenames: false
