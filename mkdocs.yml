site_name: NanoPT
site_description: Nano Post-Training — an executable white-box course from SFT to agent environments
site_url: https://shenli.github.io/nanopt/
repo_url: https://github.com/shenli/nanopt
repo_name: shenli/nanopt
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Start Here:
      - Getting Started: getting-started/index.md
      - Course Roadmap: course/index.md
  - Part I — Foundations:
      - Tokens, masks, and log probabilities: foundations/tokens-masks-logprobs.md
      - Entropy and KL divergence: foundations/entropy-and-kl.md
      - Model rendering and LoRA: foundations/model-rendering-and-lora.md
      - Optimization and LoRA: foundations/optimization-and-lora.md
      - Synthetic arithmetic: data/synthetic-arithmetic.md
      - Exact generation and reports: evaluation/exact-generation-and-reports.md
  - Part II — Post-Training:
      - Completion-only training: sft/completion-only-training.md
      - Controlled preference data: preferences/controlled-preferences.md
      - Reward models: preferences/reward-models.md
      - DPO margins and loss: preferences/dpo-by-hand.md
      - Cached-reference DPO training: preferences/dpo-training.md
      - RL foundations: rl/reinforcement-learning-foundations.md
      - REINFORCE: rl/reinforce.md
      - PPO and actor-critic: rl/ppo.md
      - Advantages and clipping: grpo-rlvr/advantages-and-clipping.md
      - Exact rollouts and rewards: grpo-rlvr/exact-rollouts-and-rewards.md
      - Synchronous GRPO: grpo-rlvr/synchronous-grpo.md
      - Reward hacking and verifiers: grpo-rlvr/reward-hacking.md
      - Objective paper guide: reading/objective-papers.md
  - Part III — Agent Training:
      - From tool call to trajectory: agents/from-tool-call-to-trajectory.md
      - Task authoring and verification: agents/task-authoring-and-verification.md
      - Agent SFT and exact action masks: agents/agent-sft.md
      - Mini Agent RL: agents/agent-rl.md
      - Sandbox security and threat model: agents/security-threat-model.md
  - Part IV — Systems:
      - End-to-end recipe and lineage: pipeline/end-to-end-recipe.md
      - Rollout infrastructure: systems/rollout-infrastructure.md
      - Production data flywheels: systems/production-flywheels.md
      - Modern post-training systems: reading/post-training-systems.md
      - Reinforcement Learning from a Systems Perspective: tutorials/rl-from-systems-perspective.md
  - Build and Extend:
      - Contribution paths: extending/contribution-paths.md
      - Algorithm contributions: contributing/algorithms.md
      - Task and verifier contributions: contributing/tasks.md
      - Hardware profile contributions: contributing/hardware.md
  - Reference:
      - Reference Library: reference/index.md
      - CLI: reference/cli.md
      - Artifact contract: reference/artifacts.md
      - Troubleshooting: troubleshooting.md
      - Glossary: glossary.md
