[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nanopt"
version = "0.1.0"
description = "Nano Post-Training: an executable white-box course from SFT to agent environments"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
authors = [{ name = "NanoPT Contributors" }]
keywords = ["llm", "post-training", "sft", "dpo", "grpo", "rlvr", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26,<3",
  "packaging>=24,<27",
  "peft>=0.15,<1",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "rich>=13.9,<15",
  "safetensors>=0.5,<1",
  "torch==2.7.1",
  "transformers>=4.51,<6",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
docs = [
  "mkdocs-material>=9.6,<10",
  "pymdown-extensions>=10.14,<11",
]
dev = [
  "build>=1.2,<2",
  "jsonschema>=4.23,<5",
  "mypy>=1.14,<2",
  "pre-commit>=4,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "types-PyYAML>=6.0.12,<7",
]
trl = ["trl"]
quant = ["bitsandbytes"]

[project.scripts]
nanopt = "nanopt.cli:app"

[project.urls]
Homepage = "https://github.com/shenli/nanopt"
Documentation = "https://shenli.github.io/nanopt/"
Repository = "https://github.com/shenli/nanopt"
Issues = "https://github.com/shenli/nanopt/issues"

# Keep Linux reference runs on a CUDA generation supported by the checked
# RTX 4070 host. Other platforms fall back to the normal PyPI source.
[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "platform_system == 'Linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/nanopt"]

[tool.hatch.build.targets.wheel.force-include]
configs = "nanopt/_builtin_configs"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["src/nanopt"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "gpu: requires a CUDA GPU",
  "network: requires network access",
  "reference: long reference-hardware validation",
  "security: agent sandbox security test",
]

[tool.coverage.run]
branch = true
source = ["nanopt"]

[tool.coverage.report]
show_missing = true
skip_covered = true
